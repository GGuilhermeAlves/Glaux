name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: site
    attributes:
      label: Site / video URL
      placeholder: https://www.youtube.com/watch?v=...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 131 / Firefox 145 / Edge…
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead? Screenshots help a lot.
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      description: F12 → Console, filter by "glaux" or errors.
      render: text
