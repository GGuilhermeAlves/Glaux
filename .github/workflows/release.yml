name: Release

# Push a tag like v1.0.0 → builds the Chrome and Firefox zips and publishes a GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches manifest version
        run: |
          V=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          [ "v$V" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME ≠ manifest v$V"; exit 1; }

      - name: Build zips
        run: ./scripts/pack.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Glaux $GITHUB_REF_NAME" \
            --notes "Download **glaux-*-chrome.zip** for Chrome/Edge/Brave/Opera or **glaux-*-firefox.zip** for Firefox. See the README for install steps and the CHANGELOG for what changed."
