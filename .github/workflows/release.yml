name: Release

# Builds the Chrome and Firefox zips and attaches them to a GitHub Release.
# Two ways to trigger it:
#   • publish a release on GitHub (Releases → Draft a new release → tag vX.Y.Z → Publish)
#   • or push a tag vX.Y.Z from the command line
on:
  release:
    types: [published]
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the manifest version
        run: |
          V=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          [ "v$V" = "$TAG" ] || { echo "Tag $TAG does not match manifest version v$V"; exit 1; }

      - name: Build zips
        run: ./scripts/pack.sh

      - name: Attach zips to the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip --title "Glaux $TAG" \
              --notes "Download **glaux-*-chrome.zip** for Chrome/Edge/Brave/Opera or **glaux-*-firefox.zip** for Firefox. See the README for install steps and the CHANGELOG for what changed."
          fi
