<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- frosted backdrop: a blurred snapshot of the page behind the popup -->
  <div class="backdrop" aria-hidden="true"><div class="shot" id="shotA"></div><div class="shot" id="shotB"></div></div>

  <main>
    <header class="frost card hero">
      <img class="logo" src="../icons/icon48.png" alt="">
      <div class="title">
        <h1>Glaux</h1>
      </div>
      <label class="switch" data-i18n-title="popPower">
        <input type="checkbox" id="enabled"><span class="track"><span class="knob"></span></span>
      </label>
    </header>

    <section class="frost card now">
      <div class="state">
        <span class="dot" id="dot"></span>
        <span id="status" data-i18n="popSearching"></span>
        <div class="res" id="res" hidden><span id="resFrom">—</span><svg viewBox="0 0 24 24"><path d="M5 12h13m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="resTo">—</b></div>
      </div>
      <button class="cta" id="tabBtn" type="button">
        <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 7.5c.9 5.6 4.9 9.6 10.5 10.5-5.6.9-9.6 4.9-10.5 10.5-.9-5.6-4.9-9.6-10.5-10.5 5.6-.9 9.6-4.9 10.5-10.5z" fill="currentColor"/></svg>
        <span id="tabBtnLabel" data-i18n="popEnableTab"></span>
      </button>
    </section>

    <section class="frost card">
      <div class="row head">
        <span data-i18n="popStrength"></span>
        <output id="sharpVal">60</output>
      </div>
      <input type="range" id="sharpness" min="0" max="100" step="1" class="slider">
      <div class="segmented" id="presets" style="--n:3">
        <span class="thumb"></span>
        <button type="button" data-v="30" data-i18n="popSoft"></button>
        <button type="button" data-v="60" data-i18n="popBalanced"></button>
        <button type="button" data-v="85" data-i18n="popIntense"></button>
      </div>
    </section>

    <section class="frost card list">
      <label class="row">
        <span class="txt"><span data-i18n="popDenoise"></span><small data-i18n="popDenoiseHint"></small></span>
        <span class="switch sm"><input type="checkbox" id="denoise"><span class="track"><span class="knob"></span></span></span>
      </label>
      <label class="row">
        <span class="txt" data-i18n="popAuto"></span>
        <span class="switch sm"><input type="checkbox" id="autoOn"><span class="track"><span class="knob"></span></span></span>
      </label>
      <label class="row">
        <span class="txt" data-i18n="popButton"></span>
        <span class="switch sm"><input type="checkbox" id="showButton"><span class="track"><span class="knob"></span></span></span>
      </label>
      <label class="row">
        <span class="txt"><span data-i18n="popSite"></span><small id="hostName"></small></span>
        <span class="switch sm"><input type="checkbox" id="siteOn"><span class="track"><span class="knob"></span></span></span>
      </label>
      <label class="row">
        <span class="txt" data-i18n="popGlass"></span>
        <span class="switch sm"><input type="checkbox" id="glassPopup"><span class="track"><span class="knob"></span></span></span>
      </label>
      <div class="row">
        <span class="txt" data-i18n="popMaxOut"></span>
        <div class="segmented mini" id="maxOutput" style="--n:3">
          <span class="thumb"></span>
          <button type="button" data-v="1920">1080p</button>
          <button type="button" data-v="2560">1440p</button>
          <button type="button" data-v="3840">4K</button>
        </div>
      </div>
    </section>

    <footer>
      <div class="keys">
        <span><kbd>Alt</kbd><kbd>Shift</kbd><kbd>R</kbd> <span data-i18n="popToggle"></span></span>
        <span><kbd>Alt</kbd><kbd>Shift</kbd><kbd>C</kbd> <span data-i18n="popCompare"></span></span>
      </div>
      <p class="local" data-i18n="popLocal"></p>
    </footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
